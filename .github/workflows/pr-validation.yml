name: PR Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: PR convention
    # release-please PRs are bot-generated changelog/version bumps; the
    # issue-first convention governs human contributions, not the release cycle
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      # Issue-free documentation is deliberately narrower than "any Markdown":
      # SKILL.md and other agent instructions are executable behavior, not docs.
      DOCS_ONLY_PATH_RE: '^(README\.md|(plugin|hook|benchmark)/README\.md|research/(.*/)?README\.md|docs/.*\.(md|png|gif|jpe?g|webp|ico)|website/(docs|blog)/.*\.md|website/i18n/.*\.md|website/static/img/.*\.(png|gif|jpe?g|webp|ico))$'
      # CI changes can alter credentials, releases, and publishing. They bypass
      # an issue only with explicit PR approval; this allowlist merely defines
      # what may ASK for that bypass. Exact policy-test path is included so the
      # gate and its regression contract can change together.
      CI_ONLY_PATH_RE: '^(\.github/(workflows/[^/]+\.ya?ml|actions/.+|dependabot\.ya?ml|PULL_REQUEST_TEMPLATE\.md)|\.pre-commit-config\.yaml|codecov\.ya?ml|release-please-config\.json|\.release-please-manifest\.json|plugin/tests/test_pr_template_matches_gates\.py)$'
    steps:
      # The commit gates below walk base..head, so the job needs the history
      # behind the PR, which a default checkout of the merge ref does not
      # carry. fetch-depth 0 fetches every branch in full; the repo is small
      # and a computed depth cannot be trusted once main has moved on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Three narrowly-defined paths may skip a separate issue:
      #   scars: human sign-off already happened at `scar promote`;
      #   docs: prose-only changes carrying type:docs;
      #   CI: allowlisted governance changes carrying BOTH type:ci and the
      #       explicit status:approved PR label.
      # Everything else remains issue-first. A mixed PR is always "other".
      - name: Classify issue policy
        id: issue_policy
        run: |
          # REST + --paginate is deliberate: a GraphQL files connection may
          # expose only its first page. One omitted code path could otherwise
          # misclassify a large mixed PR as docs-only or CI-only.
          files="$(gh api "repos/$REPO/pulls/$PR/files?per_page=100" \
                    --paginate --jq '.[].filename')"
          labels="$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')"

          kind=other
          if [ -n "$files" ] && ! grep -qvE '^\.scars/' <<<"$files"; then
            kind=scars
          elif [ -n "$files" ] && ! grep -qvE "$DOCS_ONLY_PATH_RE" <<<"$files"; then
            kind=docs
          elif [ -n "$files" ] && ! grep -qvE "$CI_ONLY_PATH_RE" <<<"$files"; then
            kind=ci
          fi

          exempt=false
          if [ "$kind" = scars ]; then
            exempt=true
          elif [ "$kind" = docs ] && grep -qx 'type:docs' <<<"$labels"; then
            exempt=true
          elif [ "$kind" = ci ] \
               && grep -qx 'type:ci' <<<"$labels" \
               && grep -qx 'status:approved' <<<"$labels"; then
            exempt=true
          fi

          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "exempt=$exempt" >> "$GITHUB_OUTPUT"
          echo "Issue policy: kind=$kind exempt=$exempt"

      # `refs` links a staged issue (one issue, several sequential PRs) without
      # GitHub's auto-close-on-merge; `closes`/`fixes`/`resolves` stay the verbs
      # for a PR that finishes its issue.
      - name: Check Issue Reference
        if: steps.issue_policy.outputs.exempt != 'true'
        run: |
          body="$(gh pr view "$PR" --repo "$REPO" --json body -q .body)"
          if ! grep -qiE '(closes|fixes|resolves|refs) #[0-9]+' <<<"$body"; then
            echo "::error::PR body must link an issue: Closes/Fixes/Resolves/Refs #N"
            exit 1
          fi

      - name: Check Issue Has status:approved
        if: steps.issue_policy.outputs.exempt != 'true'
        run: |
          body="$(gh pr view "$PR" --repo "$REPO" --json body -q .body)"
          issue="$(grep -oiE '(closes|fixes|resolves|refs) #[0-9]+' <<<"$body" | head -1 | grep -oE '[0-9]+')"
          labels="$(gh issue view "$issue" --repo "$REPO" --json labels -q '.labels[].name')"
          if ! grep -qx 'status:approved' <<<"$labels"; then
            echo "::error::Linked issue #$issue lacks the status:approved label"
            exit 1
          fi

      - name: Check PR Has type:* Label
        run: |
          count="$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name' | grep -c '^type:' || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::PR must have exactly one type:* label (found $count)"
            exit 1
          fi

      # The title names the PR in the list and, while the repo setting
      # merge_commit_title=PR_TITLE holds, it is also the merge commit subject
      # on main. release-please reads the branch commits for the changelog,
      # not the title; this is a readability rule so the PR list reads like
      # the changelog the branch introduces.
      - name: Check Conventional PR Title
        run: |
          title="$(gh pr view "$PR" --repo "$REPO" --json title -q .title)"
          if ! grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._-]+\))?!?: .+' <<<"$title"; then
            echo "::error::PR title must be a conventional commit: type(scope): description"
            exit 1
          fi

      # #1176: PRs merge with a merge commit, so every branch commit reaches
      # main as itself and release-please parses each one on its own. The
      # subject is a changelog line; the body is where a footer lives. The PR
      # title and body are not what release-please reads, whichever subject
      # the merge commit carries: a conventional merge subject duplicates the
      # branch commits' lines, a plain "Merge pull request" subject is
      # dropped. So the gates read the branch commits.
      #
      # One collector writes one file per commit under $RUNNER_TEMP/commits,
      # named NNNN-<short sha>.txt in history order, and each gate loops over
      # those files. Splitting: %B is the raw message and may contain blank
      # lines, so a newline cannot end a record. -z ends each record with NUL,
      # which git refuses inside a commit message, so NUL can only mean "next
      # commit". Record shape: <short sha>, newline, message.
      # --no-merges: a "Merge branch 'main' into ..." commit on the branch is
      # not a changelog line and release-please drops it as unparsable, which
      # is the right outcome, so it is not held to the commit rules.
      - name: Collect branch commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          d="$RUNNER_TEMP/commits"; rm -rf "$d"; mkdir -p "$d"
          n=0
          while IFS= read -r -d '' record; do
            n=$((n + 1))
            sha="${record%%$'\n'*}"
            printf '%s' "${record#*$'\n'}" > "$d/$(printf '%04d' "$n")-$sha.txt"
          done < <(git log -z --reverse --no-merges --format='%h%n%B' "$BASE_SHA..$HEAD_SHA")
          if [ "$n" -eq 0 ]; then
            echo "::error::no commits found in $BASE_SHA..$HEAD_SHA. The gates have nothing to read, and an empty check is not a pass. If the branch holds only merge commits, add the change as a commit of its own."
            exit 1
          fi
          echo "Collected $n commit(s) from $BASE_SHA..$HEAD_SHA"

      # #561: release-please reads exactly two breaking-change markers: `!`
      # in a commit subject or a `BREAKING CHANGE:` footer line in that same
      # commit's body; prose counts for nothing. Scar 0041 records the release
      # that shipped as a patch because the only marker was in text
      # release-please never read. The marker has to be in the commit that
      # describes the break, since that commit is what reaches main.
      - name: Check Breaking-Change Marker
        run: |
          failed=0
          for f in "$RUNNER_TEMP"/commits/*.txt; do
            name="${f##*/}"; sha="${name%.txt}"; sha="${sha#*-}"
            subject="$(head -n 1 "$f")"
            if grep -qiE 'breaking[ -]change' "$f" \
               && ! grep -qE '^[a-z]+(\([a-z0-9._-]+\))?!: ' <<<"$subject" \
               && ! grep -qiE '^BREAKING[- ]CHANGE: ' "$f"; then
              echo "::error::commit $sha ($subject) mentions a breaking change but its subject has no '!' and its body has no 'BREAKING CHANGE:' footer line. release-please reads only those two markers, so this would ship as an ordinary bump. Add '!' to that commit's subject (type(scope)!: ...), add the footer line to its body, or reword the commit if it is not actually breaking. The PR title and body carry no weight here."
              failed=1
            fi
          done
          exit "$failed"

      # #880: a commit release-please cannot parse is dropped from the
      # changelog AND from the version bump while the Release workflow exits
      # zero (scar 0065). Running the real parser over every branch commit
      # instead of matching known-bad shapes is deliberate: two prose rules
      # were derived for this failure and both turned out to be wrong.
      - name: Check Release-Please Can Parse
        run: |
          d="$RUNNER_TEMP/rp"; mkdir -p "$d"
          # Pinned to release-please 17.x's own dependency so this gate cannot
          # test a different grammar than the release does.
          npm install --prefix "$d" --no-save --no-audit --no-fund --silent \
            '@conventional-commits/parser@0.4.1'
          cd "$d" && COMMITS="$RUNNER_TEMP/commits" node --input-type=module -e '
            import {parser} from "@conventional-commits/parser";
            import {readdirSync, readFileSync} from "fs";
            import {join} from "path";
            const dir = process.env.COMMITS;
            let failed = false;
            for (const name of readdirSync(dir).sort()) {
              const message = readFileSync(join(dir, name), "utf8");
              try {
                parser(message);
              } catch (e) {
                const sha = name.replace(/^\d+-/, "").replace(/\.txt$/, "");
                const subject = message.split("\n", 1)[0];
                console.log("::error::release-please cannot parse commit " + sha
                  + " (" + subject + "): " + e.message
                  + ". Such a commit is dropped from the changelog and from the "
                  + "version bump while the Release workflow still reports success. "
                  + "Usual cause: a body line whose first token is immediately "
                  + "followed by an open paren containing another open paren, for "
                  + "example a line starting with foo(bar(x)). Indent that line two "
                  + "spaces, or put a word before it. Fences and backticks do not "
                  + "help. See scar 0065.");
                failed = true;
              }
            }
            if (failed) process.exit(1);
          '

      - name: Check Branch Name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          branch="$HEAD_REF"
          # Dependabot names its own branches dependabot/<ecosystem>/... and
          # they cannot be renamed; its PRs still go through every other check.
          if [[ "$branch" == dependabot/* ]]; then
            exit 0
          fi
          if ! grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)/[a-z0-9._-]+$' <<<"$branch"; then
            echo "::error::Branch name must match type/description (lowercase, a-z0-9._-)"
            exit 1
          fi
