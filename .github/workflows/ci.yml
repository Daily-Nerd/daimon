name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared minimum (requires-python); 3.13 is latest stable.
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: plugin/uv.lock

      - name: Fetch the handsal verifier
        # #1379: the contract test (tests/test_handsal_contract.py) runs
        # daimon's code against the pinned handsal checker and a real
        # vitni-verify. 3.13 only: the checker needs Python 3.11. The step
        # downloads the release tar, refuses it unless its sha256 is the
        # recorded one, extracts the verifier and writes the two variables
        # the test reads to $GITHUB_ENV. The pin, the tar and its hash live
        # in tests/_handsal_contract.py and authority.HANDSAL_PIN, never
        # here. No cache: the repo uses no cache action beyond setup-uv.
        if: ${{ matrix.python-version == '3.13' }}
        run: uv run --extra dev python tests/_handsal_contract.py env "$RUNNER_TEMP/handsal" >> "$GITHUB_ENV"

      - name: Run tests
        # --extra pretty: the rich-path smoke tests in test_render.py import
        # rich unconditionally, and the --help formatter tests in test_cli.py
        # exercise rich-argparse the same way, so the suite requires both even
        # though runtime deps are stdlib-only.
        # HOME is redirected so any test that escapes the isolation fixtures
        # fails loudly instead of silently touching a real ~/.daimon.
        run: |
          mkdir -p "$RUNNER_TEMP/fake-home"
          HOME="$RUNNER_TEMP/fake-home" uv run --extra dev --extra pretty pytest -q --cov=daimon_briefing --cov=daimon_ui --cov-report=xml --junitxml=junit.xml

      - name: Upload test results to Codecov
        if: ${{ matrix.python-version == '3.13' && !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./plugin/junit.xml
          flags: py${{ matrix.python-version }}

      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.13' && !cancelled() }}
        # Reporting only — no coverage threshold gates the build yet. The
        # upload no-ops gracefully when CODECOV_TOKEN is unset, so a missing
        # secret never turns CI red.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Daily-Nerd/daimon
          files: ./plugin/coverage.xml
          flags: py${{ matrix.python-version }}
          fail_ci_if_error: false

  lint:
    # Intended state: this job is a required status check in branch
    # protection (repo settings — maintainer action, not configurable here).
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: plugin/uv.lock

      # Blocking: ruff and mypy are version-pinned in the dev extra so the
      # gate is reproducible.
      # Same paths as .pre-commit-config.yaml — keep the two in sync so the
      # local hook and CI can never disagree about what is lint-clean.
      - name: ruff check
        run: uv run --extra dev ruff check daimon_briefing tests ../scripts

      # BLOCKING (#823): pre-enforcement debt lives in pyproject's
      # tool.mypy.overrides ratchet list, which only shrinks. Every module
      # outside that list, and every new module, is enforced here.
      - name: mypy
        run: uv run --extra dev mypy daimon_briefing

      # #795: a ReadResult reaching a body-only call site is a SILENT wrong
      # answer (a frozen dataclass is truthy, not None and not a dict): any
      # mypy finding that mentions ReadResult outside store.py fails the
      # build. Scoped by symbol, not path. NOTE (#823): the ratchet's
      # ignore_errors silences findings INSIDE listed debt modules, so this
      # guard covers a debt module only once it leaves the list; the
      # migration manifest test and scar 0063 hold that line meanwhile.
      - name: mypy ReadResult containment
        run: |
          uv run --extra dev mypy daimon_briefing > mypy-out.txt || true
          ! grep "ReadResult" mypy-out.txt | grep -v "^daimon_briefing/store.py"

  lock-windows:
    # #1401: the lock primitive is chosen once in jsonl (fcntl on POSIX,
    # msvcrt on Windows). This runs ONLY the lock contract and the hostgit
    # path comparison on the real thing; the rest of the suite is not yet
    # Windows-clean and is not run here.
    name: lock contract (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: plugin/uv.lock

      - name: lock contract tests
        run: >-
          uv run --extra dev --extra pretty pytest -q
          tests/test_lock_contract.py
          tests/test_dir_lock_identity.py
          "tests/test_identity_windows_semantics.py::test_hostgit_below_is_separator_bounded_and_case_blind_on_windows"
          "tests/test_identity_windows_semantics.py::test_hostgit_below_stays_case_sensitive_on_posix"
          "tests/test_identity_windows_semantics.py::test_hostgit_declarations_are_found_in_any_casing_on_windows"
          "tests/test_identity_windows_semantics.py::test_hostgit_declarations_stay_case_sensitive_on_posix"

  scar-lint:
    name: scar lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # Dogfood: the repo's own scar graph must always parse and lint clean.
      # A malformed scar silently never fires — this gate makes that class
      # of rot unmergeable.
      #
      # PINNED (#774): unpinned, `uvx` resolves the newest release at run
      # time, so this gate's DEFINITION could change with no commit here — a
      # new check lands as a red build on whoever opens the next PR, about
      # rot their change did not introduce. Bump this deliberately, in its
      # own PR, where new findings are the subject rather than a surprise.
      - name: scar lint
        run: uvx --from scar-cli==0.25.0 scar lint
