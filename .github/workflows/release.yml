name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# release-please does not use GITHUB_TOKEN here; it runs under the
# commit-notary App installation token minted below, which carries its own
# contents and pull-requests write.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # #517: a release PR opened with the default GITHUB_TOKEN triggers no
      # other workflows (GitHub suppresses events from that token to stop
      # recursion), so required checks never ran. An App installation token
      # is not suppressed, and the commits release-please makes through the
      # API with it are signed by GitHub, which the signed-commits rule on
      # main requires. It belongs to commit-notary rather than a maintainer
      # and expires in about an hour. No fallback: without APP_ID and
      # APP_PRIVATE_KEY this step fails, rather than opening an unsigned
      # release PR that main refuses.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # config-file + manifest so extra-files keep plugin/pyproject.toml,
          # .claude-plugin/plugin.json and marketplace.json in version lock-step.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # the package lives in plugin/, not the repo root
      - run: uv build --project plugin -o dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
